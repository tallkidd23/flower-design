<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Design Studio</title>
    <style>
        body { margin: 0; font-family: monospace; background: #000; color: #0f0; }
        #controls { position: fixed; left: 0; top: 0; width: 380px; height: 100vh; overflow-y: auto; background: rgba(0,0,0,0.9); padding: 10px; box-sizing: border-box; font-size: 11px; }
        #controls h2 { color: #ff69b4; margin: 10px 0; }
        #controls h3 { color: #0ff; margin: 15px 0 5px; border-bottom: 1px solid #333; padding-bottom: 3px; }
        #controls label { display: inline-block; width: 180px; margin: 3px 0; }
        #controls input[type="range"] { width: 140px; }
        #controls input[type="color"] { width: 50px; border: none; }
        #controls input[type="checkbox"] { margin-right: 5px; }
        #controls select { width: 145px; background: #111; color: #0f0; border: 1px solid #333; }
        #controls button { margin: 5px 2px; padding: 5px 10px; background: #333; color: #0f0; border: 1px solid #0f0; cursor: pointer; }
        #canvas-container { position: fixed; left: 380px; top: 0; width: calc(100% - 380px); height: 100vh; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="controls">
        <h2>🌸 FLOWER DESIGN STUDIO</h2>
        
        <h3>PETAL GEOMETRY</h3>
        <label>Petal Count</label><input type="range" id="petalCount" min="3" max="55" value="8"><span id="petalCountValue">8</span><br>
        <label>Petal Length</label><input type="range" id="petalLength" min="20" max="200" value="80"><span id="petalLengthValue">80</span><br>
        <label>Petal Width</label><input type="range" id="petalWidth" min="5" max="100" value="40"><span id="petalWidthValue">40</span><br>
        <label>Petal Taper</label><input type="range" id="petalTaper" min="0" max="100" value="50"><span id="petalTaperValue">50</span><br>
        <label>Petal Curl</label><input type="range" id="petalCurl" min="-100" max="100" value="0"><span id="petalCurlValue">0</span><br>
        <label>Petal Twist</label><input type="range" id="petalTwist" min="-100" max="100" value="0"><span id="petalTwistValue">0</span><br>
        <label>Phyllotaxis</label>
        <select id="phyllotaxisMode">
            <option value="spiral">Spiral (137.5&deg;)</option>
            <option value="whorled">Whorled</option>
            <option value="opposite">Opposite</option>
            <option value="alternate">Alternate</option>
            <option value="decussate">Decussate</option>
        </select><br>
        
        <h3>STEM PROPERTIES</h3>
        <label>Stem Length</label><input type="range" id="stemLength" min="50" max="500" value="200"><span id="stemLengthValue">200</span><br>
        <label>Stem Width</label><input type="range" id="stemWidth" min="1" max="30" value="8"><span id="stemWidthValue">8</span><br>
        <label>Stem Taper</label><input type="range" id="stemTaper" min="0" max="100" value="60"><span id="stemTaperValue">60</span><br>
        <label>Stem Curvature</label><input type="range" id="stemCurvature" min="0" max="100" value="30"><span id="stemCurvatureValue">30</span><br>
        <label>Stem Segments</label><input type="range" id="stemSegments" min="3" max="20" value="10"><span id="stemSegmentsValue">10</span><br>
        <label>Internode Length</label><input type="range" id="internodeLength" min="10" max="100" value="40"><span id="internodeLengthValue">40</span><br>
        
        <h3>LEAF PARAMETERS</h3>
        <label>Leaf Count</label><input type="range" id="leafCount" min="0" max="20" value="5"><span id="leafCountValue">5</span><br>
        <label>Leaf Length</label><input type="range" id="leafLength" min="10" max="150" value="40"><span id="leafLengthValue">40</span><br>
        <label>Leaf Width</label><input type="range" id="leafWidth" min="5" max="80" value="20"><span id="leafWidthValue">20</span><br>
        <label>Leaf Phyllotaxy</label>
        <select id="leafPhyllotaxy">
            <option value="alternate">Alternate</option>
            <option value="opposite">Opposite</option>
            <option value="whorled">Whorled</option>
            <option value="basal">Basal Rosette</option>
        </select><br>
        <label>Leaf Angle</label><input type="range" id="leafAngle" min="0" max="90" value="45"><span id="leafAngleValue">45</span><br>
        <label>Petiole Length</label><input type="range" id="petioleLength" min="0" max="50" value="10"><span id="petioleLengthValue">10</span><br>
        
        <h3>COLOR CONTROLS</h3>
        <label>Petal Base Color</label><input type="color" id="petalColor" value="#FF69B4"><br>
        <label>Petal Tip Color</label><input type="color" id="petalTipColor" value="#FF1493"><br>
        <label>Petal Vein Color</label><input type="color" id="petalVeinColor" value="#FF69B4"><br>
        <label>Center Color</label><input type="color" id="centerColor" value="#FFD700"><br>
        <label>Stem Color</label><input type="color" id="stemColor" value="#228B22"><br>
        <label>Stem Accent</label><input type="color" id="stemAccent" value="#006400"><br>
        <label>Leaf Color</label><input type="color" id="leafColor" value="#32CD32"><br>
        <label>Leaf Vein Color</label><input type="color" id="leafVeinColor" value="#228B22"><br>
        
        <h3>ADVANCED FEATURES</h3>
        <label><input type="checkbox" id="showThorns"> Add Thorns</label><br>
        <label>Thorn Density</label><input type="range" id="thornDensity" min="0" max="100" value="50"><span id="thornDensityValue">50</span><br>
        <label>Thorn Length</label><input type="range" id="thornLength" min="1" max="20" value="8"><span id="thornLengthValue">8</span><br>
        <label><input type="checkbox" id="showTrichomes"> Add Trichomes</label><br>
        <label>Trichome Density</label><input type="range" id="trichomeDensity" min="0" max="100" value="30"><span id="trichomeDensityValue">30</span><br>
        <label><input type="checkbox" id="carnivorous"> Carnivorous Mode</label><br>
        <label>Pitcher Count</label><input type="range" id="pitcherCount" min="0" max="10" value="3"><span id="pitcherCountValue">3</span><br>
        <label><input type="checkbox" id="showFragrance"> Visualize Fragrance</label><br>
        <label><input type="checkbox" id="showNectar"> Show Nectar Guides</label><br>
        
        <h3>TEXTURE & SURFACE</h3>
        <label>Petal Roughness</label><input type="range" id="petalRoughness" min="0" max="100" value="30"><span id="petalRoughnessValue">30</span><br>
        <label>Petal Metallic</label><input type="range" id="petalMetallic" min="0" max="100" value="10"><span id="petalMetallicValue">10</span><br>
        <label>Stem Roughness</label><input type="range" id="stemRoughness" min="0" max="100" value="70"><span id="stemRoughnessValue">70</span><br>
        <label>Leaf Roughness</label><input type="range" id="leafRoughness" min="0" max="100" value="60"><span id="leafRoughnessValue">60</span><br>
        
        <h3>RENDERING</h3>
        <label>Shadow Quality</label>
        <select id="shadowQuality">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
        </select><br>
        <label><input type="checkbox" id="autoRotate" checked> Auto Rotate</label><br>
        <label>Rotation Speed</label><input type="range" id="rotationSpeed" min="0" max="100" value="20"><span id="rotationSpeedValue">20</span><br>
        
        <h3>ACTIONS</h3>
        <button id="randomizeBtn">🎲 Randomize</button>
        <button id="saveBtn">💾 Save PNG</button>
        <button id="exportBtn">📤 Export JSON</button>
        <button id="simulateBtn">🐝 Simulation</button>
        <button id="resetBtn">🔄 Reset</button>
    </div>
    
    <div id="canvas-container"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="main.js"></script>
    <script src="export-integration.js"></script>
</body>
</html>
