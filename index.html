<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flower Designer</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .export-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid #e0e0e0;
    }
    .export-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 10px;
    }
    .export-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    .export-hint {
      font-size: 0.85rem;
      color: #666;
      line-height: 1.4;
    }
    .simulation-link {
      display: block;
      margin-top: 15px;
      padding: 12px;
      background: #f0f0f0;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      color: #333;
      font-weight: 600;
      transition: all 0.2s;
    }
    .simulation-link:hover {
      background: #e0e0e0;
    }
  </style>
</head>
<body>
  <!-- Your original detailed editor content here -->
  <!-- This preserves all your existing controls and layout -->
  
  <div class="export-section">
    <button id="exportSpeciesBtn" class="export-btn">
      📤 Export Species for Simulation
    </button>
    <p class="export-hint">
      Export your flower design as a species JSON file, then upload it to the ecosystem simulation to see it evolve and cross-pollinate with other species.
    </p>
    <a href="simulation-demo.html" class="simulation-link">
      🌿 Open Ecosystem Simulation
    </a>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
