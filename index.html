<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Flower Design Studio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #controls { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 320px; 
            height: 100vh; 
            background: rgba(20, 20, 40, 0.95);
            color: white; 
            overflow-y: auto; 
            padding: 20px; 
            box-sizing: border-box;
        }
        #controls h2 { margin-bottom: 5px; }
        #controls .subtitle { font-size: 0.85em; color: #aaa; margin-bottom: 20px; }
        #controls h3 { 
            margin: 20px 0 10px; 
            font-size: 1em;
            color: #87ceeb;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        #controls label { 
            display: block; 
            margin: 8px 0 4px;
            font-size: 0.9em;
        }
        #controls input[type="range"] { 
            width: 100%; 
            height: 5px;
            border-radius: 3px;
            background: #444;
            outline: none;
            -webkit-appearance: none;
        }
        #controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }
        #controls input[type="color"] { 
            width: 100%; 
            border: none; 
            height: 30px; 
            border-radius: 4px;
            cursor: pointer;
        }
        #controls select {
            width: 100%;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #2d3748;
            color: white;
            font-size: 0.9em;
        }
        #controls button { 
            width: 100%; 
            padding: 10px; 
            margin: 6px 0; 
            background: #4a90d9;
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
        }
        #controls button:hover { background: #357abd; }
        #controls input[type="checkbox"] {
            margin-right: 6px;
            width: 14px;
            height: 14px;
            cursor: pointer;
        }
        #canvas-container { 
            position: absolute; 
            top: 0; 
            left: 320px; 
            width: calc(100% - 320px); 
            height: 100vh;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="controls">
        <h2>🌸 Flower Design Studio</h2>
        <p class="subtitle">3D Botanical Editor</p>
        
        <h3>🌺 Petal Properties</h3>
        <label>Petal Count: <span id="petalCountValue">8</span></label>
        <input type="range" id="petalCount" min="3" max="55" value="8">
        
        <label>Petal Length: <span id="petalLengthValue">80</span></label>
        <input type="range" id="petalLength" min="30" max="150" value="80">
        
        <label>Petal Width: <span id="petalWidthValue">45</span></label>
        <input type="range" id="petalWidth" min="15" max="80" value="45">
        
        <label>Phyllotaxis Mode:</label>
        <select id="phyllotaxisMode">
            <option value="spiral">Spiral (Golden Angle)</option>
            <option value="whorled">Whorled</option>
            <option value="opposite">Opposite</option>
            <option value="alternate">Alternate</option>
        </select>
        
        <h3>🌿 Stem Properties</h3>
        <label>Stem Length: <span id="stemLengthValue">220</span></label>
        <input type="range" id="stemLength" min="100" max="350" value="220">
        
        <label>Stem Width: <span id="stemWidthValue">10</span></label>
        <input type="range" id="stemWidth" min="2" max="20" value="10">
        
        <label>Stem Curvature: <span id="stemCurvatureValue">0.3</span></label>
        <input type="range" id="stemCurvature" min="0" max="1" step="0.1" value="0.3">
        
        <label>Leaf Count: <span id="leafCountValue">5</span></label>
        <input type="range" id="leafCount" min="0" max="12" value="5">
        
        <h3>✨ Advanced Features</h3>
        <label>
            <input type="checkbox" id="showThorns"> 
            Add Thorns
        </label>
        <label>
            <input type="checkbox" id="showTrichomes"> 
            Add Trichomes (Hairs)
        </label>
        <label>
            <input type="checkbox" id="carnivorous"> 
            Carnivorous Mode
        </label>
        
        <h3>🎨 Colors</h3>
        <label>Petal Color:</label>
        <input type="color" id="petalColor" value="#FF69B4">
        
        <label>Center Color:</label>
        <input type="color" id="centerColor" value="#FFD700">
        
        <label>Stem Color:</label>
        <input type="color" id="stemColor" value="#228B22">
        
        <label>Leaf Color:</label>
        <input type="color" id="leafColor" value="#32CD32">
        
        <h3>🎯 Actions</h3>
        <button id="randomizeBtn">🎲 Randomize</button>
        <button id="saveBtn">💾 Save PNG</button>
        <button id="exportBtn">📤 Export JSON</button>
        <button id="simulateBtn">🐝 Simulation</button>
    </div>
    
    <div id="canvas-container"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="main.js"></script>
    <script src="export-integration.js"></script>
</body>
</html>
