<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flower Designer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🌸 Flower Designer</h1>
    
    <div class="main-layout">
      <div class="canvas-container">
        <canvas id="flowerCanvas"></canvas>
      </div>

      <div class="controls-panel">
        <div class="control-group">
          <label for="petalCount">Petal Count</label>
          <input type="range" id="petalCount" min="3" max="20" value="5">
          <span id="petalCountValue">5</span>
        </div>

        <div class="control-group">
          <label for="petalLength">Petal Length</label>
          <input type="range" id="petalLength" min="0.5" max="2" step="0.1" value="1">
          <span id="petalLengthValue">1</span>
        </div>

        <div class="control-group">
          <label for="petalColor">Petal Color</label>
          <input type="color" id="petalColor" value="#ff6b9e">
        </div>

        <div class="control-group">
          <label for="stemHeight">Stem Height</label>
          <input type="range" id="stemHeight" min="0.5" max="3" step="0.1" value="1.5">
          <span id="stemHeightValue">1.5</span>
        </div>

        <div class="control-group">
          <label for="leafSize">Leaf Size</label>
          <input type="range" id="leafSize" min="0.3" max="1.5" step="0.1" value="0.7">
          <span id="leafSizeValue">0.7</span>
        </div>

        <div class="export-section">
          <button id="exportSpeciesBtn" class="export-btn">
            📤 Export Species for Simulation
          </button>
          <p class="export-hint">
            Export your flower as a species JSON file, then upload it to simulation-demo.html
          </p>
        </div>

        <div class="link-section">
          <a href="simulation-demo.html" class="simulation-link">
            🌿 Open Ecosystem Simulation
          </a>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
