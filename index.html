<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Design Studio - Three.js Editor</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: system-ui; }
        #controls { position: absolute; top: 0; left: 0; width: 300px; height: 100vh; background: rgba(0,0,0,0.8); color: white; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        #controls h3 { margin-top: 20px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        #controls label { display: block; margin: 10px 0 5px; }
        #controls input[type="range"] { width: 100%; }
        #controls input[type="color"] { width: 100%; border: none; height: 30px; }
        #controls button { width: 100%; padding: 10px; margin: 5px 0; background: #4a90d9; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #controls button:hover { background: #357abd; }
        #canvas-container { position: absolute; top: 0; left: 300px; width: calc(100% - 300px); height: 100vh; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="controls">
        <h2>🌸 Flower Editor</h2>
        
        <h3>Petal Properties</h3>
        <label>Petal Count: <span id="petalCountValue">5</span></label>
        <input type="range" id="petalCount" min="3" max="55" value="5">
        
        <label>Petal Length: <span id="petalLengthValue">80</span></label>
        <input type="range" id="petalLength" min="30" max="150" value="80">
        
        <label>Petal Width: <span id="petalWidthValue">40</span></label>
        <input type="range" id="petalWidth" min="15" max="80" value="40">
        
        <label>Phyllotaxis Mode:</label>
        <select id="phyllotaxisMode" style="width:100%; padding:5px;">
            <option value="spiral">Spiral (Golden Angle)</option>
            <option value="whorled">Whorled</option>
            <option value="opposite">Opposite</option>
            <option value="alternate">Alternate</option>
        </select>
        
        <h3>Stem Properties</h3>
        <label>Stem Length: <span id="stemLengthValue">200</span></label>
        <input type="range" id="stemLength" min="100" max="350" value="200">
        
        <label>Stem Width: <span id="stemWidthValue">8</span></label>
        <input type="range" id="stemWidth" min="2" max="20" value="8">
        
        <label>Stem Curvature: <span id="stemCurvatureValue">0.3</span></label>
        <input type="range" id="stemCurvature" min="0" max="1" step="0.1" value="0.3">
        
        <label>Leaf Count: <span id="leafCountValue">3</span></label>
        <input type="range" id="leafCount" min="0" max="12" value="3">
        
        <h3>Advanced Features</h3>
        <label><input type="checkbox" id="showThorns"> Add Thorns</label>
        <label><input type="checkbox" id="showTrichomes"> Add Trichomes (Hairs)</label>
        <label><input type="checkbox" id="carnivorous"> Carnivorous Mode</label>
        
        <h3>Colors</h3>
        <label>Petal Color:</label>
        <input type="color" id="petalColor" value="#FF69B4">
        
        <label>Center Color:</label>
        <input type="color" id="centerColor" value="#FFD700">
        
        <label>Stem Color:</label>
        <input type="color" id="stemColor" value="#228B22">
        
        <label>Leaf Color:</label>
        <input type="color" id="leafColor" value="#32CD32">
        
        <h3>Actions</h3>
        <button id="randomizeBtn">🎲 Randomize</button>
        <button id="saveBtn">💾 Save Design</button>
        <button id="exportBtn">📤 Export JSON</button>
        <button id="simulateBtn">🐝 Start Simulation</button>
    </div>
    
    <div id="canvas-container"></div>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="main.js"></script>
    <script src="export-integration.js"></script>
</body>
</html>
