<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Abstract Bloom Lab</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="canvas-container"></div>

  <div id="controls">
    <h1>Abstract Bloom Lab</h1>

    <div class="control-group">
      <label for="petalCount">Petal count</label>
      <input type="range" id="petalCount" min="3" max="20" step="1" value="9" />
      <span id="petalCountValue">9</span>
    </div>

    <div class="control-group">
      <label for="petalLength">Petal length</label>
      <input type="range" id="petalLength" min="0.5" max="3.0" step="0.1" value="1.8" />
      <span id="petalLengthValue">1.8</span>
    </div>

    <div class="control-group">
      <label for="petalCurl">Petal curl</label>
      <input type="range" id="petalCurl" min="-1.0" max="1.0" step="0.05" value="0.4" />
      <span id="petalCurlValue">0.4</span>
    </div>

    <div class="control-group">
      <label for="stemHeight">Stem height</label>
      <input type="range" id="stemHeight" min="0.5" max="3.0" step="0.1" value="2.0" />
      <span id="stemHeightValue">2.0</span>
    </div>

    <div class="control-group">
      <label for="bloomOpenness">Bloom openness</label>
      <input type="range" id="bloomOpenness" min="0.0" max="1.0" step="0.05" value="0.7" />
      <span id="bloomOpennessValue">0.7</span>
    </div>

    <div class="control-group">
      <label for="growthSpeed">Growth speed</label>
      <input type="range" id="growthSpeed" min="0.2" max="3.0" step="0.1" value="1.0" />
      <span id="growthSpeedValue">1.0</span>
    </div>

    <div class="control-group">
      <label for="colorBase">Base color</label>
      <input type="color" id="colorBase" value="#6a1b9a" />
    </div>

    <div class="control-group">
      <label for="colorTip">Tip color</label>
      <input type="color" id="colorTip" value="#ce93d8" />
    </div>

    <div class="button-row">
      <button id="playPauseBtn">Play</button>
      <button id="resetBtn">Reset</button>
      <button id="randomizeBtn">Randomize</button>
      <button id="saveBtn">Save Design</button>
      <button id="loadBtn">Load Design</button>
    </div>

    <div class="time-display">
      Day <span id="dayValue">0</span> of <span id="totalDays">100</span>
    </div>

    <input type="file" id="loadFile" accept=".json" style="display:none" />
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
