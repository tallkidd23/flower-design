<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecosystem Simulation Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 20px;
      font-size: 2.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 20px;
    }

    .field-container {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    #fieldCanvas {
      width: 100%;
      height: 600px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      background: #f8f9fa;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .panel {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .panel h2 {
      color: #667eea;
      margin-bottom: 15px;
      font-size: 1.3rem;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 10px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f5f5f5;
    }

    .stat-label {
      color: #666;
      font-weight: 500;
    }

    .stat-value {
      color: #333;
      font-weight: 600;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .btn-danger {
      background: #e74c3c;
      color: white;
    }

    .btn-danger:hover {
      background: #c0392b;
    }

    .log-container {
      max-height: 300px;
      overflow-y: auto;
      font-family: "Courier New", monospace;
      font-size: 0.85rem;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
    }

    .log-entry {
      padding: 4px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .log-entry.success {
      color: #27ae60;
    }

    .log-entry.info {
      color: #2980b9;
    }

    .log-entry.warning {
      color: #f39c12;
    }

    .legend {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    @media (max-width: 900px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌸 Ecosystem Simulation Demo</h1>

    <div class="main-layout">
      <div class="field-container">
        <canvas id="fieldCanvas"></canvas>
      </div>

      <div class="sidebar">
        <div class="panel">
          <h2>Controls</h2>
          <div class="controls">
            <button class="btn-primary" id="startBtn">▶ Start</button>
            <button class="btn-secondary" id="pauseBtn">⏸ Pause</button>
            <button class="btn-secondary" id="resetBtn">🔄 Reset</button>
            <button class="btn-danger" id="clearLogBtn">🗑 Clear Log</button>
          </div>
        </div>

        <div class="panel">
          <h2>Statistics</h2>
          <div class="stat-row">
            <span class="stat-label">Day:</span>
            <span class="stat-value" id="dayStat">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Plants:</span>
            <span class="stat-value" id="plantsStat">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Pollinators:</span>
            <span class="stat-value" id="pollinatorsStat">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Seeds:</span>
            <span class="stat-value" id="seedsStat">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Germinated:</span>
            <span class="stat-value" id="germinatedStat">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Pollinations:</span>
            <span class="stat-value" id="pollinationsStat">0</span>
          </div>
        </div>

        <div class="panel">
          <h2>Legend</h2>
          <div class="legend">
            <div class="legend-item">
              <div class="legend-dot" style="background: #3a1670;"></div>
              <span>Moon Crest</span>
            </div>
            <div class="legend-item">
              <div class="legend-dot" style="background: #d9531e;"></div>
              <span>Ember Bell</span>
            </div>
            <div class="legend-item">
              <div class="legend-dot" style="background: #a178ff;"></div>
              <span>Moth</span>
            </div>
            <div class="legend-item">
              <div class="legend-dot" style="background: #e74c3c;"></div>
              <span>Butterfly</span>
            </div>
            <div class="legend-item">
              <div class="legend-dot" style="background: #27ae60;"></div>
              <span>Seedling</span>
            </div>
          </div>
        </div>

        <div class="panel">
          <h2>Event Log</h2>
          <div class="log-container" id="eventLog"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="simulation-demo.js"></script>
</body>
</html>
