<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecosystem Simulation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #fff;
      overflow: hidden;
    }
    #app {
      display: grid;
      grid-template-columns: 1fr 320px;
      height: 100vh;
    }
    #canvas-container {
      background: #000;
      position: relative;
    }
    #controls {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 20px;
      overflow-y: auto;
      border-left: 1px solid #2a2a4e;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 20px;
      color: #a8b4f0;
    }
    .panel {
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .panel h2 {
      font-size: 1rem;
      color: #a8b4f0;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 8px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 0.9rem;
    }
    .stat-label { color: #888; }
    .stat-value { color: #fff; font-weight: 600; }
    button {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
    .btn-secondary { background: rgba(255,255,255,0.1); color: white; }
    .btn-secondary:hover { background: rgba(255,255,255,0.2); }
    .file-input-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: rgba(255,255,255,0.1);
      border: 2px dashed rgba(255,255,255,0.3);
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      color: #aaa;
      margin-bottom: 12px;
    }
    .file-input-btn:hover { background: rgba(255,255,255,0.15); border-color: #667eea; color: #fff; }
    #fileInput { display: none; }
    .species-list { max-height: 200px; overflow-y: auto; }
    .species-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 0.85rem;
    }
    .species-color { width: 20px; height: 20px; border-radius: 4px; border: 2px solid rgba(255,255,255,0.2); }
    .species-info { flex: 1; }
    .species-name { font-weight: 600; color: #fff; }
    .species-count { font-size: 0.75rem; color: #888; }
    .log-container {
      max-height: 250px;
      overflow-y: auto;
      font-family: "Courier New", monospace;
      font-size: 0.8rem;
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .log-entry { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .log-entry.success { color: #4ade80; }
    .log-entry.info { color: #60a5fa; }
    .log-entry.warning { color: #fbbf24; }
    .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
  </style>
</head>
<body>
  <div id="app">
    <div id="canvas-container"></div>
    <div id="controls">
      <h1>🌿 Ecosystem Simulation</h1>
      
      <div class="panel">
        <h2>Controls</h2>
        <button class="btn-primary" id="startBtn">▶ Start</button>
        <button class="btn-secondary" id="pauseBtn">⏸ Pause</button>
        <button class="btn-secondary" id="resetBtn">🔄 Reset</button>
      </div>

      <div class="panel">
        <h2>Load Species</h2>
        <label for="fileInput" class="file-input-btn">📁 Upload species JSON</label>
        <input type="file" id="fileInput" accept=".json,application/json">
        <div class="species-list" id="speciesList"></div>
      </div>

      <div class="panel">
        <h2>Statistics</h2>
        <div class="stat-row"><span class="stat-label">Day:</span><span class="stat-value" id="dayStat">0</span></div>
        <div class="stat-row"><span class="stat-label">Plants:</span><span class="stat-value" id="plantsStat">0</span></div>
        <div class="stat-row"><span class="stat-label">Pollinators:</span><span class="stat-value" id="pollinatorsStat">0</span></div>
        <div class="stat-row"><span class="stat-label">Seeds:</span><span class="stat-value" id="seedsStat">0</span></div>
        <div class="stat-row"><span class="stat-label">Pollinations:</span><span class="stat-value" id="pollinationsStat">0</span></div>
      </div>

      <div class="panel">
        <h2>Species</h2>
        <div class="legend" id="legendContainer"></div>
      </div>

      <div class="panel">
        <h2>Event Log</h2>
        <div class="log-container" id="eventLog"></div>
      </div>
    </div>
  </div>

  <script type="module" src="simulation-demo.js"></script>
</body>
</html>
